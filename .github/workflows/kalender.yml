name: Termine aktualisieren

on:
  schedule:
    # Taeglich um 04:15 UTC. Cron laeuft immer in UTC, im Sommer also 06:15
    # Ortszeit. Taeglich statt woechentlich, weil termine.ics abonniert wird:
    # was hier nicht ankommt, sieht auch niemand im eigenen Kalender. Ohne
    # echte Aenderung entsteht kein Commit, leere Laeufe kosten also nichts.
    # Achtung: geplante Laeufe starten nur auf dem Standardbranch des Repositories.
    - cron: "15 4 * * *"
  workflow_dispatch: {}
  push:
    # Nach einer Aenderung am Skript direkt neu erzeugen.
    paths:
      - scripts/kalender.py
      - .github/workflows/kalender.yml

permissions:
  contents: write

concurrency:
  group: kalender
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Termine holen und Seite schreiben
        env:
          # Oeffentliche Schnittstelle, deshalb kein Secret noetig.
          # Ueber eine Repository-Variable gleichen Namens laesst sie sich
          # ueberschreiben, falls die Adresse sich einmal aendert.
          TERMINE_URL: ${{ vars.TERMINE_URL || 'https://hohenstaufen-aalen.gaudeam.de/api/v1/open_events.json' }}
          # Adresse der Website. Sie steht in den Abo-Links der Kalenderdatei,
          # die muessen absolut sein. Bei eigener Domain hier die Variable setzen.
          SITE_URL: ${{ vars.SITE_URL || 'https://alaeubli.github.io/ftv-Hohenstaufen' }}
        run: python3 scripts/kalender.py "$TERMINE_URL"

      - name: Aenderungen committen
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Keine Aenderungen, nichts zu committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veranstaltungen.html data/termine.json termine.ics
          git commit -m "Termine aktualisiert"
          git push
